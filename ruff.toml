
line-length = 100
target-version = "py310"

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "RUF100",  # unused noqa directives
]
ignore = []

[format]
quote-style = "double"
indent-style = "space"
