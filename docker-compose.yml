# Required secrets (must be provided, e.g. in .env): POSTGRES_PASSWORD,
# SECRET_KEY, MEDIA_SIGNING_KEY, PROVIDER_KEY_ENCRYPTION_KEY (v1:<Fernet key> format),
# DEFAULT_ADMIN_PASSWORD. This applies to the release/offline package too: its
# streamlined docker-compose still requires the same secrets.
#
# 4-container topology: postgres / redis / backend / frontend.
# The backend container hosts uvicorn, two celery workers, celery beat and the
# outbox publisher via supervisord (see supervisord.conf).
# A 5th service, `sampler` (out-of-process frame sampling for image-mode
# providers, ADR 0014), is opt-in via compose profile `sampler`
# (`docker compose --profile sampler up -d --build`); a plain
# `docker compose up` still starts only the 4 services above.
#
# APP_ENV defaults to `development` here for the self-host quickstart. Set
# APP_ENV=production in .env to enable the production secret validation
# (distinct SECRET_KEY / MEDIA_SIGNING_KEY + v1:<Fernet> PROVIDER_KEY_ENCRYPTION_KEY).
# docker-compose.release.yml hard-codes APP_ENV=production.
services:
  postgres:
    image: postgres:17-alpine
    container_name: hm_postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: home_monitor
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d home_monitor"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - app_bridge

  redis:
    image: redis:alpine
    container_name: hm_redis
    # AOF keeps a published outbox event's broker message across a Redis
    # crash. Without it the RDB snapshot may lose up to 60 s of writes,
    # and the outbox state machine has no published -> pending edge, so a
    # lost message could never be re-sent.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - app_bridge

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hm_backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/home_monitor
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      MEDIA_SIGNING_KEY: ${MEDIA_SIGNING_KEY:?set MEDIA_SIGNING_KEY in .env}
      PROVIDER_KEY_ENCRYPTION_KEY: ${PROVIDER_KEY_ENCRYPTION_KEY:?set PROVIDER_KEY_ENCRYPTION_KEY in .env}
      MCP_TOKEN: ${MCP_TOKEN:-}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-zh-CN}
      VIDEO_ROOT_PATH: /data/videos
      PLAYBACK_CACHE_ROOT: /data/hls
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?set DEFAULT_ADMIN_PASSWORD in .env}
      DB_INIT_MAX_RETRIES: ${DB_INIT_MAX_RETRIES:-120}
      DB_INIT_RETRY_INTERVAL_SECONDS: ${DB_INIT_RETRY_INTERVAL_SECONDS:-2}
      # Informational only: the backend does NOT read this variable. The
      # effective sampler endpoint is the SystemConfig key `frame_sampler_url`
      # (the client reads it from the config registry; see sampler/README.md,
      # "Docker Compose"). It exists so operators can find the endpoint at
      # the compose level; the sampler itself only starts with
      # `--profile sampler`.
      FRAME_SAMPLER_URL: http://sampler:18080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./xiaomi_video:/data/videos
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - app_bridge

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hm_frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8226:80"
    networks:
      - app_bridge

  # Out-of-process frame sampler for image-mode providers (ADR 0014). Opt-in
  # via compose profile `sampler`; a plain `docker compose up` is unchanged.
  # No Postgres/Redis, no secrets; the video root is mounted read-only and
  # joined to app_bridge so the backend can reach it at http://sampler:18080.
  sampler:
    build:
      context: ./sampler
    container_name: hm_sampler
    profiles: ["sampler"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SAMPLER_PORT: "18080"
      # In-container whitelist of roots the sampler may read (empty = nothing
      # allowed, so /videos must be set for the service to serve requests).
      SAMPLER_ALLOWED_ROOTS: /videos
      # Optional ONNX detector model path; empty = service still starts with
      # model_loaded: false (healthz stays 200).
      SAMPLER_MODEL_PATH: ${SAMPLER_MODEL_PATH:-}
    # Published host-side for debugging only; the backend reaches the sampler
    # over app_bridge, no published port required for that.
    ports:
      - "18080:18080"
    volumes:
      # Read-only; same host directory as the backend's /data/videos mount.
      # NOTE: VIDEO_ROOT_PATH here is a HOST path (default ./xiaomi_video,
      # matching the backend mount), not the in-container /data/videos.
      - ${VIDEO_ROOT_PATH:-./xiaomi_video}:/videos:ro
    # Matches the Dockerfile HEALTHCHECK (interval 30s / timeout 5s /
    # start-period 10s / retries 3).
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app_bridge

volumes:
  postgres_data:
  redis_data:

networks:
  app_bridge:
    driver: bridge
