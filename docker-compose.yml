# Required secrets (must be provided, e.g. in .env): POSTGRES_PASSWORD,
# SECRET_KEY, MEDIA_SIGNING_KEY, PROVIDER_KEY_ENCRYPTION_KEY (v1:<Fernet key> format),
# DEFAULT_ADMIN_PASSWORD. This applies to the release/offline package too: its
# streamlined docker-compose still requires the same secrets.
services:
  postgres:
    image: postgres:17-alpine
    container_name: hm_postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: home_monitor
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d home_monitor"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - app_bridge

  redis:
    image: redis:alpine
    container_name: hm_redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - app_bridge

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hm_backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/home_monitor
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      MEDIA_SIGNING_KEY: ${MEDIA_SIGNING_KEY:?set MEDIA_SIGNING_KEY in .env}
      PROVIDER_KEY_ENCRYPTION_KEY: ${PROVIDER_KEY_ENCRYPTION_KEY:?set PROVIDER_KEY_ENCRYPTION_KEY in .env}
      MCP_TOKEN: ${MCP_TOKEN:-}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-zh-CN}
      VIDEO_ROOT_PATH: /data/videos
      PLAYBACK_CACHE_ROOT: /data/hls
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?set DEFAULT_ADMIN_PASSWORD in .env}
      DB_INIT_MAX_RETRIES: ${DB_INIT_MAX_RETRIES:-120}
      DB_INIT_RETRY_INTERVAL_SECONDS: ${DB_INIT_RETRY_INTERVAL_SECONDS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./xiaomi_video:/data/videos
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - app_bridge

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hm_celery_worker
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/home_monitor
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      MEDIA_SIGNING_KEY: ${MEDIA_SIGNING_KEY:?set MEDIA_SIGNING_KEY in .env}
      PROVIDER_KEY_ENCRYPTION_KEY: ${PROVIDER_KEY_ENCRYPTION_KEY:?set PROVIDER_KEY_ENCRYPTION_KEY in .env}
      MCP_TOKEN: ${MCP_TOKEN:-}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-zh-CN}
      VIDEO_ROOT_PATH: /data/videos
      PLAYBACK_CACHE_ROOT: /data/hls
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?set DEFAULT_ADMIN_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./xiaomi_video:/data/videos
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A src.core.celery_app worker --loglevel=info -Q celery
    networks:
      - app_bridge

  celery_vision_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hm_celery_vision_worker
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/home_monitor
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      MEDIA_SIGNING_KEY: ${MEDIA_SIGNING_KEY:?set MEDIA_SIGNING_KEY in .env}
      PROVIDER_KEY_ENCRYPTION_KEY: ${PROVIDER_KEY_ENCRYPTION_KEY:?set PROVIDER_KEY_ENCRYPTION_KEY in .env}
      MCP_TOKEN: ${MCP_TOKEN:-}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-zh-CN}
      VIDEO_ROOT_PATH: /data/videos
      PLAYBACK_CACHE_ROOT: /data/hls
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?set DEFAULT_ADMIN_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./xiaomi_video:/data/videos
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A src.core.celery_app worker --loglevel=info -Q analysis_hot,analysis_full --concurrency=1
    networks:
      - app_bridge

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hm_celery_beat
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/home_monitor
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      MEDIA_SIGNING_KEY: ${MEDIA_SIGNING_KEY:?set MEDIA_SIGNING_KEY in .env}
      PROVIDER_KEY_ENCRYPTION_KEY: ${PROVIDER_KEY_ENCRYPTION_KEY:?set PROVIDER_KEY_ENCRYPTION_KEY in .env}
      MCP_TOKEN: ${MCP_TOKEN:-}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-zh-CN}
      VIDEO_ROOT_PATH: /data/videos
      PLAYBACK_CACHE_ROOT: /data/hls
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?set DEFAULT_ADMIN_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./xiaomi_video:/data/videos
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A src.core.celery_app beat --loglevel=info
    networks:
      - app_bridge

  outbox_publisher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hm_outbox_publisher
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/home_monitor
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      MEDIA_SIGNING_KEY: ${MEDIA_SIGNING_KEY:?set MEDIA_SIGNING_KEY in .env}
      PROVIDER_KEY_ENCRYPTION_KEY: ${PROVIDER_KEY_ENCRYPTION_KEY:?set PROVIDER_KEY_ENCRYPTION_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./xiaomi_video:/data/videos
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python -m src.application.outbox
    networks:
      - app_bridge
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from src.application.outbox.publisher import OutboxPublisher; print('healthy')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hm_frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8226:80"
    networks:
      - app_bridge

volumes:
  postgres_data:
  redis_data:

networks:
  app_bridge:
    driver: bridge
