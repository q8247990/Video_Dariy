# 单容器部署：supervisord 在 backend 容器内托管全部应用进程。
#
#   api              - FastAPI/uvicorn HTTP 入口
#   worker           - celery worker，消费 `celery` 队列（扫描/日报/webhook/维护）
#   vision-worker    - celery worker，消费 analysis_hot/analysis_full（并发固定为 1）
#   beat             - celery beat 定时调度（必须保持单实例）
#   outbox-publisher - 事务性 outbox 发布器（轮询 outbox_event 投递 broker）
#
# 所有进程日志直接输出到容器 stdout，由 Docker json-file 驱动统一轮转。
# 任一进程崩溃由 supervisord 自动拉起；容器停止时 killasgroup 保证
# celery prefork 子进程组一并退出（acks_late + 断点续跑保证任务不丢）。

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:api]
command=uvicorn src.main:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
startretries=999
startsecs=1
stopsignal=TERM
stopwaitsecs=10
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:worker]
command=celery -A src.core.celery_app worker --loglevel=info -Q celery --concurrency=2
directory=/app
autostart=true
autorestart=true
startretries=999
startsecs=5
stopsignal=TERM
stopwaitsecs=30
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:vision-worker]
command=celery -A src.core.celery_app worker --loglevel=info -Q analysis_hot,analysis_full --concurrency=1
directory=/app
autostart=true
autorestart=true
startretries=999
startsecs=5
stopsignal=TERM
stopwaitsecs=30
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:beat]
command=celery -A src.core.celery_app beat --loglevel=info
directory=/app
autostart=true
autorestart=true
startretries=999
startsecs=5
stopsignal=TERM
stopwaitsecs=10
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:outbox-publisher]
command=python -m src.application.outbox
directory=/app
autostart=true
autorestart=true
startretries=999
startsecs=3
stopsignal=TERM
stopwaitsecs=10
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
